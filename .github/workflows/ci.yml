name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка Poetry и зависимостей (без ML-группы)
        run: |
          pip install poetry==1.8.4
          poetry config virtualenvs.create false
          poetry install --no-root --with dev
      - name: Линтер
        run: ruff check backend scripts tests frontend
      - name: Тесты и покрытие
        run: pytest --cov=backend --cov-report=term --cov-report=xml --cov-fail-under=70
      - name: Автоматическая оценка качества (mock-модель, n=20)
        env:
          EMBEDDING_BACKEND: hashing
          LLM_FALLBACK_ORDER: '["mock"]'
          LOG_LEVEL: WARNING
        run: |
          python scripts/run_eval.py --sample-sizes 20 --modes baseline +dict +rag +agents \
            --models mock --output results/ci --no-charts
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/ci/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа (без ML-группы)
        run: docker build -f infrastructure/Dockerfile --build-arg INSTALL_ML=false -t product-descriptions:ci .
      - name: Проверка docker-compose
        run: docker compose -f infrastructure/docker-compose.yml config -q
