name: product-descriptions

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://app:app@db:5432/descriptions
  REDIS_URL: redis://redis:6379/0
  USE_REDIS_CACHE: "true"
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_TASK_ALWAYS_EAGER: "false"
  QDRANT_URL: http://qdrant:6333
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  OLLAMA_MODELS: '["qwen2.5:7b","qwen2.5:3b","qwen2.5:1.5b"]'
  ENSEMBLE_MODELS: '["ollama:qwen2.5:7b","ollama:qwen2.5:3b"]'
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32b}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  LOG_JSON: "true"

x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
    args:
      INSTALL_ML: ${INSTALL_ML:-true}
  image: product-descriptions:latest
  environment: *app-env
  volumes:
    - app_logs:/app/logs
    - hf_cache:/app/.cache
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: descriptions
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d descriptions"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    # Для GPU раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-init:
    image: ollama/ollama:0.5.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_PULL_MODELS:-qwen2.5:7b qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c", "for m in $$MODELS; do echo \"pull $$m\"; ollama pull $$m; done"]
    restart: "no"

  app:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  worker:
    <<: *app
    command: ["celery", "-A", "backend.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  beat:
    <<: *app
    command: ["celery", "-A", "backend.worker.celery_app", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    <<: *app
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.baseUrlPath=/ui", "--browser.gatherUsageStats=false"]
    environment:
      <<: *app-env
      API_URL: http://app:8000/api/v1
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8501/ui/_stcore/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }
      frontend: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  qdrant_data:
  ollama_data:
  app_logs:
  hf_cache:
