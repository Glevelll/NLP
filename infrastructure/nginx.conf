upstream api_upstream { server app:8000; }
upstream ui_upstream { server frontend:8501; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json text/plain text/css application/javascript text/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location / { return 302 /ui/; }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # генерация с локальной LLM и оценка могут идти долго
    }

    location ~ ^/(docs|redoc|openapi.json|healthz) {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    location /ui/ {
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # websocket Streamlit
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
