[tool.poetry]
name = "product-description-generator"
version = "1.0.0"
description = "Мультиагентный генератор продающих описаний товаров для интернет-магазинов (RAG + LLM + оценка качества)"
authors = ["Gleb Nikishin <gleb.nikishin.2003@gmail.com>"]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115,<1"
uvicorn = { version = ">=0.32", extras = ["standard"] }
pydantic = "^2.9"
pydantic-settings = "^2.6"
email-validator = "^2.2"
python-multipart = ">=0.0.17"
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
aiosqlite = "^0.20"
asyncpg = "^0.30"
httpx = "^0.27"
bcrypt = "^4.2"
pyjwt = "^2.9"
celery = { version = "^5.4", extras = ["redis"] }
redis = "^5.2"
qdrant-client = "^1.12"
rank-bm25 = "^0.2.2"
numpy = ">=1.26,<3"
scipy = "^1.14"
scikit-learn = "^1.5"
sacrebleu = "^2.4"
snowballstemmer = "^2.2"
plotly = "^5.24"
pandas = "^2.2"
streamlit = "^1.40"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = { version = "^2.5", source = "pytorch-cpu" }
sentence-transformers = "^3.3"
transformers = "^4.46"
bert-score = "^0.3.13"
accelerate = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
pytest-cov = ">=6.0"
ruff = ">=0.8"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/worker/celery_app.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
